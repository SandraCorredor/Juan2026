<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operación: Expediente Clasificado - Agente Juan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onkeydown="handleGlobalKeyDown(event)">

    <div class="container" id="mainContainer">
        <header>
            <h1>⚠️ PROTOCOLO OMEGA: EXPEDIENTE ACTIVO ⚠️</h1>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </header>

        <main id="gameContainer"></main>
    </div>

    <div id="modalOverlay" class="victory-overlay hidden">
        <div class="victory-card" id="victoryCardBox">
            <h2 id="modalTitle">⚡ ACCESO CONCEDIDO</h2>
            <div id="modalContent" style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 5px; text-align: left; line-height: 1.6;"></div>
            
            <div id="modalRiddleBox" class="riddle-box hidden">
                <p style="margin: 0 0 8px 0; color: #38bdf8; font-weight: bold; letter-spacing: 1px;"> ACERTIJO DE UBICACIÓN FINAL:</p>
                "Analiza la última pista clave: El mejor regalo está muy cerquita de ti, ¿adivinas en dónde?."
            </div>

            <div id="modalVideoContainer" class="hidden" style="margin: 15px 0;">
                <video id="finalVideo" width="100%" controls style="border-radius: 6px; border: 1px solid var(--success-color);">
                    <source src="sorpresa.mp4" type="video/mp4">
                    Tu navegador no soporta el formato de video.
                </video>
            </div>

            <p id="modalLoveMsg" style="font-size: 1.1rem; color: var(--accent-color); margin-top: 10px; font-weight: bold; display: none;">🎉 ¡Te amo con toda el alma, eres brillante! 🎉</p>
            
            <button id="modalBtn" onclick="modalAction()" style="margin-top: 15px;">SIGUIENTE FASE ➡️</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
